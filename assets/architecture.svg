<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">AskAround architecture</title>
  <desc id="desc">The Vue browser calls FastAPI over server-sent events. FastAPI runs the AskAround agent, which uses OpenRouter, Google Places tools, and SQLite sessions. The evaluation harness runs the same agent with mock fixtures.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#38434f"/></marker>
    <style>
      .box{rx:14;stroke-width:2}.label{font:600 17px Arial,sans-serif;fill:#1f2933;text-anchor:middle}.sub{font:14px Arial,sans-serif;fill:#52606d;text-anchor:middle}.edge{fill:none;stroke:#38434f;stroke-width:2;marker-end:url(#arrow)}.dash{stroke-dasharray:8 6}.edge-label{font:13px Arial,sans-serif;fill:#38434f;text-anchor:middle}
    </style>
  </defs>
  <rect width="1200" height="650" fill="#ffffff"/>
  <text x="600" y="40" style="font:700 25px Arial,sans-serif;fill:#102a43;text-anchor:middle">AskAround architecture</text>

  <rect class="box" x="35" y="225" width="190" height="90" fill="#fff4ee" stroke="#d96b4b"/>
  <text class="label" x="130" y="263">User browser</text><text class="sub" x="130" y="288">Vue + Vite chat UI</text>
  <rect class="box" x="295" y="225" width="190" height="90" fill="#eef6ff" stroke="#4f81bd"/>
  <text class="label" x="390" y="263">FastAPI backend</text><text class="sub" x="390" y="288">REST + SSE streaming</text>
  <rect class="box" x="555" y="225" width="190" height="90" fill="#f2efff" stroke="#8064a2"/>
  <text class="label" x="650" y="263">AskAround agent</text><text class="sub" x="650" y="288">OpenAI Agents SDK</text>

  <rect class="box" x="850" y="80" width="200" height="80" fill="#effaf2" stroke="#5b9b68"/>
  <text class="label" x="950" y="114">OpenRouter</text><text class="sub" x="950" y="139">LLM inference</text>
  <rect class="box" x="850" y="225" width="200" height="90" fill="#effaf2" stroke="#5b9b68"/>
  <text class="label" x="950" y="263">Google Places API</text><text class="sub" x="950" y="288">Text + Nearby Search</text>
  <rect class="box" x="850" y="370" width="200" height="80" fill="#fff9e8" stroke="#c9a227"/>
  <text class="label" x="950" y="404">SQLite sessions</text><text class="sub" x="950" y="429">Conversation history</text>

  <rect class="box" x="555" y="505" width="190" height="85" fill="#f7f7f7" stroke="#6b7280" stroke-dasharray="8 6"/>
  <text class="label" x="650" y="540">Evaluation harness</text><text class="sub" x="650" y="565">Fixtures + graders</text>
  <rect class="box" x="850" y="512" width="200" height="70" fill="#f7f7f7" stroke="#6b7280" stroke-dasharray="8 6"/>
  <text class="label" x="950" y="540">Mock place fixtures</text><text class="sub" x="950" y="563">No Google billing</text>

  <path class="edge" d="M225 270 H295"/><text class="edge-label" x="260" y="246">SSE</text>
  <path class="edge" d="M485 270 H555"/><text class="edge-label" x="520" y="246">run</text>
  <path class="edge" d="M745 245 H795 V120 H850"/><text class="edge-label" x="795" y="104">model calls</text>
  <path class="edge" d="M745 270 H850"/><text class="edge-label" x="798" y="248">tools</text>
  <path class="edge" d="M745 295 H795 V410 H850"/><text class="edge-label" x="800" y="395">history</text>
  <path class="edge dash" d="M650 505 V315"/><text class="edge-label" x="700" y="430">same agent</text>
  <path class="edge dash" d="M745 547 H850"/><text class="edge-label" x="798" y="526">mock data</text>
</svg>
